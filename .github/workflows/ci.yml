# GitHub Actions: 推送到 GitHub 后自动构建并校验.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: node -e "const m=require('./package.json'); if(!m.dsh||!m.dsh.bundle) process.exit(1)"
      - run: test -f lib/index.js && test -f lib/client.js && test -f cordis.patch.yml
      - uses: actions/upload-artifact@v7
        with:
          name: lib
          path: |
            lib/
            cordis.patch.yml
            package.json
